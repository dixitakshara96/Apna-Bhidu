<!DOCTYPE html>
<html>
<head>
    <title>ApnaBhidu Dashboard</title>
</head>

<body>

    <h1>ApnaBhidu</h1>

    <h2>All Complaints</h2>

    <a href="{% url 'create_complaint' %}">
        Submit New Complaint
    </a>

    
{% for complaint in complaints %}

    <div>
        <h3>{{ complaint.title }}</h3>

        <p>{{ complaint.category }}</p>

        <p>{{ complaint.status }}</p>

        <p>{{ complaint.created_at }}</p>

        <a href="{% url 'complaint_details' complaint.pk %}">
            View Details
        </a>

    </div>

    <hr>

{% empty %}

    <p>No complaints found.</p>

{% endfor %}


</body>
</html>
